services:
  payguard-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: payguard-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - payguard-net

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: payguard-prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - payguard-api
    networks:
      - payguard-net

  grafana:
    image: grafana/grafana:10.3.3
    container_name: payguard-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - payguard-net

  mlflow:
    image: python:3.11-slim
    container_name: payguard-mlflow
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: >
      bash -c "pip install --no-cache-dir mlflow &&
               mlflow server --backend-store-uri sqlite:///mlruns.db --default-artifact-root /workspace/mlruns --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - payguard-net

  airflow:
    image: apache/airflow:2.8.1
    container_name: payguard-airflow
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - _AIRFLOW_DB_MIGRATE=true
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
      - ./models:/opt/airflow/models
      - ./config:/opt/airflow/config
    ports:
      - "8080:8080"
    command: standalone
    restart: unless-stopped
    networks:
      - payguard-net

networks:
  payguard-net:
    driver: bridge
